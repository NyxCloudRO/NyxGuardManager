services:
  nyxguard-manager:
    build:
      context: .
      dockerfile: dev/developer-message/Dockerfile
      args:
        NYXGUARD_SOURCE_REVISION: "${NYXGUARD_SOURCE_REVISION:-uncommitted}"
    image: nyxguardmanager:4.0.18-dev-developer-message
    environment:
      NPM_BUILD_VERSION: "4.0.18"
      NPM_BUILD_COMMIT: "${NYXGUARD_SOURCE_REVISION:-uncommitted}"
      NPM_BUILD_DATE: "2026-08-30"
